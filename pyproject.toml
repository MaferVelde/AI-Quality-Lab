[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quality-lab"
version = "0.2.0.dev0"
description = "Reproducible evaluation toolkit for RAG and AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "typer>=0.12,<1.0",
  "pydantic>=2.7,<3.0",
  "rich>=13.7,<15.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[project.scripts]
aiql = "ai_quality_lab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
